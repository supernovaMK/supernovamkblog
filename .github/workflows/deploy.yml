name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있습니다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 진행합니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 사이트 빌드
        # 저장소 이름이 <계정>.github.io 면 하위 경로가 없고,
        # 그 외에는 /<저장소 이름> 아래에 올라갑니다.
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            BASE_PATH="" npm run build
          else
            BASE_PATH="/${{ github.event.repository.name }}" npm run build
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
